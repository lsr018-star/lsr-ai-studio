# Static file server for LSR AI Studio.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Security basics
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Never cache the app shell — always get the newest index.html
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store";
  }
  location = /sw.js {
    expires -1;
    add_header Cache-Control "no-store";
  }

  # Hashed-by-you static assets can cache longer; plain names stay short
  location ~* \.(css|js|svg|webmanifest)$ {
    expires 1h;
    add_header Cache-Control "public";
  }

  # Single-page fallback (all routes serve the studio)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
